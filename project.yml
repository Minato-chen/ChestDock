name: ChestDock
options:
  bundleIdPrefix: com.chestdock
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic

targets:
  ChestDock:
    type: application
    platform: macOS
    sources:
      - path: ChestDock
        excludes:
          - "Resources/Info.plist"
          - "Resources/ChestDock.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chestdock.app
        PRODUCT_NAME: ChestDock
        INFOPLIST_FILE: ChestDock/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ChestDock/Resources/ChestDock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
